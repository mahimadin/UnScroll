name: unscroll
description: A focused, distraction-free social app. No reels, no algorithmic feed.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true

name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.unscroll --project-name unscroll .
          git checkout -- lib pubspec.yaml
          rm -rf test

      - run: flutter pub get

      - name: Configure Android SDK and plugins
        run: python3 tool/patch_android.py

      - run: flutter build apk --release --verbose

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Unscroll.apk

      - uses: actions/upload-artifact@v4
        with:
          name: unscroll-apk
          path: Unscroll.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Unscroll.apk
